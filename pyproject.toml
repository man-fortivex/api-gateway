[project]
name = "api-gateway-saas-cli"
version = "1.0.0"
description = "gatewayctl — CLI for the API Gateway SaaS admin API"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "httpx>=0.27"]

[project.scripts]
gatewayctl = "cli.gatewayctl:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli"]
